<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root {font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;color:#17253f}
  * {box-sizing:border-box} body {margin:0;background:#fff} main {padding:24px 4px 0}
  h1 {font-size:clamp(23px,3vw,35px);margin:0 0 14px;line-height:1.35;letter-spacing:-.04em}
  .devices {display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
  button {cursor:pointer;border:1.5px solid #cbd5e1;background:#fff;color:#30415c;border-radius:12px;
          padding:10px 16px;min-height:46px;font:600 16px system-ui,sans-serif;touch-action:manipulation}
  button.active {background:#1d4ed8;color:white;border-color:#1d4ed8}
  .controls {display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;margin-bottom:13px}
  .control {min-width:0} .control label {display:flex;justify-content:space-between;gap:6px;font-size:16px;font-weight:650;margin-bottom:7px}
  output {color:#1d4ed8;font-variant-numeric:tabular-nums}
  input[type=range] {width:100%;height:34px;margin:0;accent-color:#2563eb;cursor:pointer;touch-action:none}
  .control.disabled {opacity:.42}
  [hidden] {display:none !important}
  .frame {border:1px solid #dce5f2;border-radius:17px;background:#f9fbff;overflow:hidden}
  canvas {display:block;width:100%;height:clamp(370px,48vw,580px)}
  .under {display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 13px;border-top:1px solid #e3eaf4}
  .under span {font-size:15px;font-weight:650}
  .count {display:flex;align-items:center;gap:6px;white-space:nowrap}
  .count button {padding:5px 11px;min-height:36px;font-size:15px}
  @media(max-width:760px) {
    main {padding-top:18px} h1 {margin:0 0 12px} .devices {gap:6px;margin-bottom:12px}
    .devices button {flex:1 1 29%;padding:8px 6px;font-size:14px;min-height:43px}
    .controls {gap:9px} .control label {font-size:13px;flex-wrap:wrap}
    .under span {font-size:12px} .count button {font-size:13px;padding:4px 8px}
  }
</style></head><body><main>
  <h1>🔎 광선 추적 실험실</h1>
  <nav class="devices" aria-label="광학 기기"></nav>
  <section class="controls">
    <div class="control optics"><label for="distance">물체 거리 <output id="distanceValue">12.0</output></label><input id="distance" type="range" min="2" max="24" step="0.1" value="12"></div>
    <div class="control optics" id="focusControl"><label for="focus">초점 거리 <output id="focusValue">6.0</output></label><input id="focus" type="range" min="2" max="12" step="0.1" value="6"></div>
    <div class="control optics"><label for="height">물체 높이 <output id="heightValue">2.5</output></label><input id="height" type="range" min="0.5" max="5" step="0.1" value="2.5"></div>
    <div class="control prism" hidden><label for="angle">꼭짓각 <output id="angleValue">45°</output></label><input id="angle" type="range" min="35" max="50" step="1" value="45"></div>
    <div class="control prism" hidden><label for="index">기준 굴절률 <output id="indexValue">1.52</output></label><input id="index" type="range" min="1.45" max="1.65" step="0.01" value="1.52"></div>
    <div class="control prism" hidden><label for="entry">입사 높이 <output id="entryValue">0.0</output></label><input id="entry" type="range" min="-1" max="1.5" step="0.1" value="0"></div>
  </section>
  <div class="frame"><canvas id="diagram" role="img" aria-label="선택한 광학 기기, 물체, 광선과 상의 그림"></canvas>
    <div class="under"><span id="result" aria-live="polite"></span><div class="count"><span>광선</span>
      <button type="button" data-rays="1">1개</button><button type="button" data-rays="2">2개</button><button type="button" data-rays="3">3개</button></div></div>
  </div>
</main>
<script>
(() => {
  const names=['볼록렌즈','오목렌즈','평면거울','볼록거울','오목거울','프리즘'];
  const state={kind:0,rays:3,target:{d:12,f:6,h:2.5,angle:45,index:1.52,entry:0},
               shown:{d:12,f:6,h:2.5,angle:45,index:1.52,entry:0}};
  const canvas=document.getElementById('diagram'),ctx=canvas.getContext('2d');
  const inputs={d:document.getElementById('distance'),f:document.getElementById('focus'),h:document.getElementById('height'),
                angle:document.getElementById('angle'),index:document.getElementById('index'),entry:document.getElementById('entry')};
  const outputs={d:document.getElementById('distanceValue'),f:document.getElementById('focusValue'),h:document.getElementById('heightValue'),
                 angle:document.getElementById('angleValue'),index:document.getElementById('indexValue'),entry:document.getElementById('entryValue')};
  const colors=['#e74747','#05a4ce','#19a563'];
  const nav=document.querySelector('.devices');
  for(let i=0;i<names.length;i++){
    let b=document.createElement('button');b.type='button';b.textContent=names[i];
    b.onclick=()=>{state.kind=i;updateButtons();requestDraw()};nav.appendChild(b);
  }
  function updateButtons(){
    [...nav.children].forEach((b,i)=>{b.classList.toggle('active',i===state.kind);b.setAttribute('aria-pressed',i===state.kind)});
    document.querySelectorAll('[data-rays]').forEach(b=>{
      let active=Number(b.dataset.rays)===state.rays;
      b.classList.toggle('active',active);b.setAttribute('aria-pressed',active);
    });
    let plane=state.kind===2;inputs.f.disabled=plane;
    document.getElementById('focusControl').classList.toggle('disabled',plane);
    document.querySelectorAll('.optics').forEach(el=>el.hidden=state.kind===5);
    document.querySelectorAll('.prism').forEach(el=>el.hidden=state.kind!==5);
  }
  document.querySelectorAll('[data-rays]').forEach(b=>b.onclick=()=>{
    state.rays=Number(b.dataset.rays);updateButtons();requestDraw();
  });
  for(let key of Object.keys(inputs))inputs[key].addEventListener('input',()=>{
    state.target[key]=Number(inputs[key].value);
    outputs[key].textContent=key==='angle'?`${state.target[key].toFixed(0)}°`:
      state.target[key].toFixed(key==='index'?2:1);
    requestDraw();
  });
  let pending=false;
  function requestDraw(){if(!pending){pending=true;requestAnimationFrame(frame)}}
  function frame(){
    pending=false;let moving=false;
    for(let key of Object.keys(inputs)){
      let delta=state.target[key]-state.shown[key];
      if(Math.abs(delta)>.002){state.shown[key]+=delta*.36;moving=true}
      else state.shown[key]=state.target[key];
    }
    draw();if(moving)requestDraw();
  }
  let W=0,H=0,S=1,OX=0,OY=0;
  const X=x=>OX+x*S,Y=y=>OY-y*S;
  function line(x1,y1,x2,y2,color,width=2,dash=[]){
    ctx.save();ctx.beginPath();ctx.setLineDash(dash);ctx.moveTo(X(x1),Y(y1));ctx.lineTo(X(x2),Y(y2));
    ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.stroke();ctx.restore();
  }
  function label(t,x,y,color='#344562',size=15,align='center'){
    ctx.save();ctx.fillStyle=color;ctx.font=`600 ${size}px system-ui,sans-serif`;
    ctx.textAlign=align;ctx.fillText(t,X(x),Y(y));ctx.restore();
  }
  function point(x,name){
    ctx.beginPath();ctx.arc(X(x),Y(0),4,0,Math.PI*2);ctx.fillStyle='#5d6f8d';ctx.fill();
    label(name,x,-.8,'#415575',Math.max(12,Math.min(15,W/75)));
  }
  function verticalArrow(x,y,color,name,virtual=false){
    line(x,0,x,y,color,5,virtual?[7,5]:[]);
    let sign=Math.sign(y)||1,xp=X(x),yp=Y(y);
    ctx.beginPath();ctx.moveTo(xp,yp);ctx.lineTo(xp-7,yp+sign*14);ctx.lineTo(xp+7,yp+sign*14);
    ctx.closePath();ctx.fillStyle=color;ctx.fill();
    label(name,x+.65,y+sign*1,color,14,'left');
  }
  function drawDevice(kind,dh){
    ctx.save();
    if(kind<2){
      ctx.beginPath();
      for(let i=0;i<=80;i++){
        let y=-dh+2*dh*i/80,t=y/dh;
        let width=kind===0?.22+.55*(1-t*t):.19+.55*t*t;
        if(i===0)ctx.moveTo(X(-width),Y(y));else ctx.lineTo(X(-width),Y(y));
      }
      for(let i=80;i>=0;i--){
        let y=-dh+2*dh*i/80,t=y/dh;
        let width=kind===0?.22+.55*(1-t*t):.19+.55*t*t;
        ctx.lineTo(X(width),Y(y));
      }
      ctx.closePath();ctx.fillStyle='rgba(77,171,245,.27)';ctx.fill();
      ctx.lineWidth=3;ctx.strokeStyle='#2563eb';ctx.stroke();
    }else{
      let curve=kind===4?-.75:(kind===3?.75:0);
      ctx.beginPath();
      for(let i=0;i<=80;i++){
        let y=-dh+2*dh*i/80,x=curve*(y/dh)**2;
        if(i===0)ctx.moveTo(X(x),Y(y));else ctx.lineTo(X(x),Y(y));
      }
      ctx.lineWidth=7;ctx.strokeStyle='#3c526c';ctx.stroke();
      for(let i=-5;i<=5;i++){
        let y=dh*i/6,x=curve*(y/dh)**2;
        line(x+.14,y-.13,x+.46,y+.21,'#9baabe',1.2);
      }
    }
    ctx.restore();
  }
  const cross=(a,b)=>a.x*b.y-a.y*b.x;
  const subtract=(a,b)=>({x:a.x-b.x,y:a.y-b.y});
  const normalize=v=>{let z=Math.hypot(v.x,v.y);return {x:v.x/z,y:v.y/z}};
  function intersection(p,d,a,b){
    let e=subtract(b,a),den=cross(d,e);
    if(Math.abs(den)<1e-8)return null;
    let v=subtract(a,p),t=cross(v,e)/den,u=cross(v,d)/den;
    return t>=0&&u>=0&&u<=1?{x:p.x+t*d.x,y:p.y+t*d.y}:null;
  }
  // N은 투과하는 쪽의 법선. 접선 성분에 스넬 법칙을 적용한다.
  function refract(v,n,from,to){
    let along=v.x*n.x+v.y*n.y,scale=from/to;
    let tx=scale*(v.x-along*n.x),ty=scale*(v.y-along*n.y);
    let normal=Math.sqrt(Math.max(0,1-tx*tx-ty*ty));
    return {x:tx+normal*n.x,y:ty+normal*n.y};
  }
  function drawPrism(){
    S=Math.min((W-32)/23,(H-40)/16);OX=W*.46;OY=H*.40;
    const {angle,index,entry}=state.shown;
    let half=4*Math.tan(angle*Math.PI/360);
    const bl={x:-half,y:-4},top={x:0,y:4},br={x:half,y:-4};
    ctx.beginPath();ctx.moveTo(X(bl.x),Y(bl.y));ctx.lineTo(X(top.x),Y(top.y));
    ctx.lineTo(X(br.x),Y(br.y));ctx.closePath();
    ctx.fillStyle='rgba(125,211,252,.26)';ctx.fill();
    ctx.lineWidth=3;ctx.strokeStyle='#3873ae';ctx.stroke();
    const origin={x:-10,y:entry},dir={x:1,y:0};
    let first=intersection(origin,dir,bl,top);
    if(!first)return;
    line(-10,entry,first.x,first.y,'#8f9bab',8);
    line(-10,entry,first.x,first.y,'#ffffff',5);
    const l=normalize(subtract(top,bl)),r=normalize(subtract(br,top));
    const insideNormal={x:l.y,y:-l.x},outsideNormal={x:-r.y,y:r.x};
    const spectra=[{name:'빨강',color:'#ed4d45',n:index-.025},
                   {name:'초록',color:'#15a56e',n:index},
                   {name:'보라',color:'#8750dd',n:index+.025}];
    spectra.slice(0,state.rays).forEach(s=>{
      let inner=refract(dir,insideNormal,1,s.n);
      let second=intersection(first,inner,top,br);
      if(!second)return;
      let out=refract(inner,outsideNormal,s.n,1);
      let xend=10.5,yend=second.y+out.y/out.x*(xend-second.x);
      line(first.x,first.y,second.x,second.y,s.color,2.8);
      line(second.x,second.y,xend,yend,s.color,3.3);
      label(s.name,xend-.15,yend+.35,s.color,15,'right');
    });
    document.getElementById('result').textContent='백색광 → 파장에 따른 굴절과 분산';
  }
  function draw(){
    let rect=canvas.getBoundingClientRect(),ratio=Math.min(window.devicePixelRatio||1,2);
    let w=Math.max(320,rect.width),h=Math.max(300,rect.height);
    if(canvas.width!==Math.round(w*ratio)||canvas.height!==Math.round(h*ratio)){
      canvas.width=Math.round(w*ratio);canvas.height=Math.round(h*ratio);
    }
    ctx.setTransform(ratio,0,0,ratio,0,0);W=w;H=h;
    ctx.clearRect(0,0,W,H);S=Math.min((W-26)/56,(H-42)/24);OX=W/2;OY=H/2;
    const {d,f:fa,h:objh}=state.shown,kind=state.kind;
    if(kind===5){drawPrism();return}
    const mirror=kind>=2,focal=kind===2?Infinity:((kind===0||kind===4)?fa:-fa);
    const inv=1/focal-1/d,infinity=Math.abs(inv)<1e-4;
    const q=infinity?Infinity:1/inv,magnification=-q/d;
    const ix=mirror?-q:q,iy=magnification*objh;
    const boundary=(W/2-13)/S,yboundary=(H/2-21)/S;
    const dh=Math.min(yboundary*.78,Math.max(3.2,objh*1.45));
    line(-boundary,0,boundary,0,'#94a3b8',1.5,[4,5]);
    drawDevice(kind,dh);
    if(kind<2){point(0,'O');point(-fa,'F');point(fa,'F′')}
    else {point(0,'V');if(kind!==2){point(-focal,'F');point(-2*focal,'C')}}
    verticalArrow(-d,objh,'#2259c7','물체');
    if(!infinity&&Math.abs(ix)<boundary-1&&Math.abs(iy)<yboundary-1){
      verticalArrow(ix,iy,'#9b42d0','상',q<0);
    }
    const hits=kind===2?[objh*.8,objh*.25,-objh*.4]:[objh,0,objh*.5];
    for(let i=0;i<state.rays;i++){
      let a=hits[i],c=colors[i];
      line(-d,objh,0,a,c,2.6);
      let slope=mirror?(objh-a)/d+a/focal:(a-objh)/d-a/focal;
      let end=mirror?-boundary:boundary;
      line(0,a,end,a+slope*end,c,2.6);
      if(!infinity&&q<0){
        let extend=Math.max(-boundary,Math.min(boundary,ix));
        line(0,a,extend,a+slope*extend,c,1.6,[6,5]);
      }
    }
    let result=infinity?'상: 무한히 멀리 형성':
      `상: ${magnification>0?'정립':'도립'} ${q>0?'실상':'허상'} · ${Math.abs(magnification).toFixed(2)}배`;
    document.getElementById('result').textContent=result;
  }
  updateButtons();new ResizeObserver(requestDraw).observe(canvas);requestDraw();
})();
</script></body></html>
